<!doctype html>
<html lang="ru" data-theme="evolution">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Прототип редизайна · План проектов и Мои задачи</title>
<style>
/* ===== Токены (из дизайн-системы «Конструктор процессов») ===== */
:root,[data-theme="evolution"]{
  --surface:#f7f8fa;--surface-raised:#ffffff;--surface-sunken:#eef1f5;--line:#e4e8ee;--line-strong:#c3ccd8;
  --ink:#17212f;--ink-muted:#5f6b7a;--accent:#2563eb;--on-accent:#ffffff;--accent-soft:#eaf1ff;--accent-strong:#1d4ed8;
  --danger:#b42318;--danger-soft:#fff1ef;--success:#16794a;--success-soft:#e3f4ea;--warning:#9a5b00;--warning-soft:#fdf1dc;--scrim:#17212f70;
  --p1:#2f7de1;--p2:#c2502b;--p3:#2c8a62;
  --shadow-popover:0 12px 36px rgba(23,33,47,.14);--shadow-modal:0 24px 90px rgba(7,17,30,.3);
  --font-display:Inter,ui-sans-serif,-apple-system,"Segoe UI",sans-serif;
}
[data-theme="graphite"]{
  --surface:#14181f;--surface-raised:#1c222b;--surface-sunken:#0f1218;--line:#2c3440;--line-strong:#4a5565;
  --ink:#e8ecf2;--ink-muted:#9aa6b6;--accent:#6aa2ff;--on-accent:#0b1220;--accent-soft:#26385c;--accent-strong:#9bc0ff;
  --danger:#ff8a80;--danger-soft:#3a1f1d;--success:#5fd38d;--success-soft:#1c3a2b;--warning:#f0b44c;--warning-soft:#3a2f17;--scrim:#00000099;
  --p1:#6aa2ff;--p2:#ff9b6b;--p3:#5fd38d;
  --shadow-popover:0 12px 36px rgba(0,0,0,.55);--shadow-modal:0 24px 90px rgba(0,0,0,.6);
}
[data-theme="paper"]{
  --surface:#f6f1e7;--surface-raised:#fffdf8;--surface-sunken:#ece5d6;--line:#ddd3bf;--line-strong:#bfb298;
  --ink:#2a2218;--ink-muted:#6b5f4d;--accent:#1f6f5c;--on-accent:#fffdf8;--accent-soft:#dcebe4;--accent-strong:#17594a;
  --danger:#a3341f;--danger-soft:#f7e2dc;--success:#2d6a3e;--success-soft:#dcebdd;--warning:#8a5a00;--warning-soft:#f5e6c5;--scrim:#2a221870;
  --p1:#2b6cb0;--p2:#b5532a;--p3:#2d6a3e;
  --shadow-popover:0 8px 24px rgba(42,34,24,.16);--shadow-modal:0 24px 80px rgba(42,34,24,.3);
  --font-display:"Source Serif 4",Georgia,"Times New Roman",serif;
}
:root{--r-sm:6px;--r-md:10px;--r-lg:16px;--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s6:24px}

/* ===== База ===== */
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/20px Inter,ui-sans-serif,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--surface);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.display{font-family:var(--font-display)}
[data-theme="paper"] .display{font-weight:600}
[hidden]{display:none!important}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface-raised);color:var(--ink);border-radius:var(--r-sm);padding:6px 12px;font-weight:600;white-space:nowrap;line-height:18px}
.btn:hover{background:var(--surface-sunken)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-sunken)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.icon{padding:6px 8px}
.field{display:flex;flex-direction:column;gap:var(--s1);font-size:11px;font-weight:600;color:var(--ink-muted)}
.input{border:1px solid var(--line-strong);background:var(--surface-raised);border-radius:var(--r-sm);padding:7px 10px;font-weight:400;font-size:13px;color:var(--ink);min-width:0;width:100%}
.input::placeholder{color:var(--ink-muted)}
textarea.input{resize:vertical}
.overline{font-size:11px;line-height:16px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-muted)}
.caption{font-size:11px;line-height:16px;color:var(--ink-muted)}
.page-title{font-size:20px;line-height:28px;font-weight:700;letter-spacing:-.01em}
[data-theme="paper"] .page-title{font-size:24px;line-height:30px}
.seg{display:inline-flex;background:var(--surface-sunken);border-radius:var(--r-sm);padding:2px}
.seg button{border:0;background:transparent;padding:4px 12px;border-radius:5px;font-weight:600;font-size:12px;color:var(--ink-muted)}
.seg button[aria-pressed=true]{background:var(--surface-raised);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}

/* ===== Каркас ===== */
.app{display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(0,1fr);height:100%}
.header{display:flex;align-items:center;gap:var(--s6);padding:0 var(--s4);height:56px;background:var(--surface-raised);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:210px}
.brand-mark{width:30px;height:30px;border-radius:var(--r-md);background:var(--ink);color:var(--surface-raised);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.brand strong{display:block;font-size:13px;line-height:16px}.brand small{display:block;font-size:11px;line-height:14px;color:var(--ink-muted)}
.nav{display:flex;gap:2px}
.nav button{display:flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--ink-muted);padding:8px 12px;border-radius:var(--r-sm);font-weight:600}
.nav button:hover{background:var(--surface-sunken);color:var(--ink)}
.nav button[aria-current=page]{color:var(--accent-strong);background:var(--accent-soft)}
.nav svg{width:16px;height:16px;flex:none}
.header-end{margin-left:auto;display:flex;gap:var(--s3);align-items:center}
.main{min-height:0;min-width:0;display:flex;flex-direction:column}
.view{display:none;min-height:0;min-width:0;flex:1}
.view.on{display:flex;flex-direction:column}
.ux-bar{display:flex;align-items:center;gap:var(--s2);padding:6px var(--s4);background:var(--surface-sunken);border-bottom:1px solid var(--line);font-size:12px;color:var(--ink-muted);flex-wrap:wrap}
.ux-bar b{color:var(--ink)}
[data-theme="graphite"] .app{grid-template-rows:1fr;grid-template-columns:200px minmax(0,1fr)}
[data-theme="graphite"] .header{flex-direction:column;align-items:stretch;height:auto;gap:var(--s4);padding:var(--s4) var(--s3);border-bottom:0;border-right:1px solid var(--line)}
[data-theme="graphite"] .nav{flex-direction:column}
[data-theme="graphite"] .nav button{padding:9px 10px}
[data-theme="graphite"] .header-end{margin:auto 0 0;flex-direction:column;align-items:stretch}
[data-theme="graphite"] .brand{min-width:0}
@media(max-width:900px){
  [data-theme="graphite"] .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
  [data-theme="graphite"] .header{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}
  [data-theme="graphite"] .nav{flex-direction:row}[data-theme="graphite"] .header-end{margin:0 0 0 auto;flex-direction:row}
  .brand small,.brand-text{display:none}.brand{min-width:0}.header{gap:var(--s2);overflow-x:auto}
}

/* ===== Модальные окна и поповеры ===== */
.backdrop{position:fixed;inset:0;background:var(--scrim);z-index:100;display:grid;place-items:center;padding:var(--s6)}
.modal{width:min(560px,100%);max-height:calc(100vh - 48px);overflow:auto;background:var(--surface-raised);border-radius:var(--r-lg);box-shadow:var(--shadow-modal);padding:var(--s6);display:flex;flex-direction:column;gap:var(--s4)}
.modal.wide{width:min(760px,100%)}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s3)}
.modal-head h2{font-size:18px;line-height:26px}
.modal-actions{display:flex;justify-content:flex-end;gap:var(--s2);margin-top:var(--s2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.popover{position:absolute;z-index:60;min-width:200px;background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-popover);padding:6px}
.popover strong{display:block;padding:6px 10px 4px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-muted)}
.popover button.item{display:flex;width:100%;border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:var(--r-sm);gap:8px}
.popover button.item:hover{background:var(--surface-sunken)}
.popover button.item:disabled{opacity:.5}
.toast{position:fixed;right:20px;bottom:20px;z-index:200;background:var(--ink);color:var(--surface-raised);padding:10px 14px;border-radius:var(--r-md);box-shadow:var(--shadow-popover)}
.menu-wrap{position:relative;display:inline-block}

/* ===== План проектов ===== */
.plan-toolbar{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);background:var(--surface-raised);border-bottom:1px solid var(--line);flex-wrap:wrap}
.plan-toolbar .titles{margin-right:auto}
.plan-toolbar .titles p{color:var(--ink-muted);font-size:12px}
.search{width:200px}
.count-badge{background:var(--accent);color:var(--on-accent);border-radius:999px;font-size:10px;line-height:16px;min-width:16px;text-align:center;padding:0 4px}
.filters{display:flex;gap:var(--s2);padding:var(--s2) var(--s4);background:var(--surface-raised);border-bottom:1px solid var(--line);flex-wrap:wrap}
.filters select{width:auto;min-width:150px}
.period{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s4);border-bottom:1px solid var(--line);background:var(--surface-raised);flex-wrap:wrap}
.period label{display:flex;align-items:center;gap:6px;color:var(--ink-muted);font-size:12px}
.period .input{width:auto;padding:4px 8px}
.plan-body{display:flex;flex:1;min-height:0;min-width:0;flex-direction:column}
.plan-scroll{flex:1;overflow:auto;min-width:0;min-height:0;position:relative}
.grid{width:max-content;min-width:100%}
.g-row{display:grid;grid-template-columns:288px minmax(calc(var(--n)*84px),1fr);border-bottom:1px solid var(--line);min-width:calc(288px + var(--n)*84px)}
.g-label{position:sticky;left:0;z-index:3;background:var(--surface-raised);border-right:1px solid var(--line);padding:var(--s2) var(--s3);display:flex;align-items:center;gap:var(--s2);min-width:0}
.g-head{position:sticky;top:0;z-index:5;background:var(--surface-raised)}
.g-head .g-label{align-items:flex-end;z-index:6}
.weeks{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));position:relative}
.wk-h{padding:6px 4px;text-align:center;border:0;border-right:1px solid var(--line);background:var(--surface-raised);color:var(--ink-muted);display:flex;flex-direction:column;align-items:center;line-height:15px}
.wk-h:hover{background:var(--surface-sunken)}
.wk-h strong{font-size:11px;color:var(--ink)}.wk-h small{font-size:10px}
.wk-h.now{background:var(--accent-soft);box-shadow:inset 0 -3px var(--accent)}
.wk-h.now strong{color:var(--accent-strong)}
.g-load .g-label{background:var(--surface);color:var(--ink-muted);font-size:11px;font-weight:600}
.g-load .weeks{background:var(--surface)}
.load{border:0;border-right:1px solid var(--line);background:transparent;padding:5px 8px;display:flex;align-items:center}
.load:hover{background:var(--surface-sunken)}
.load i{display:block;height:6px;border-radius:3px;background:var(--success);width:100%;position:relative}
.load i::after{content:"";position:absolute;inset:0;border-radius:3px;background:var(--surface-sunken);left:var(--p)}
.load.warn i{background:var(--warning)}.load.bad i{background:var(--danger)}
.load.zero i{background:var(--line)}
.load span{position:absolute}
.g-project .g-label,.g-project .weeks{background:var(--surface-sunken)}
.g-project .g-label{font-weight:700}.g-project .g-label>span:first-of-type{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.g-project .g-label .caption{white-space:nowrap}
.g-project .weeks{min-height:36px}
.g-del .weeks{min-height:72px}
.g-lane .g-label{padding-left:calc(var(--s3) + 22px);color:var(--ink-muted);font-weight:600}
.g-block .g-label{padding-left:calc(var(--s3) + 44px)}
.g-block .g-label small{color:var(--ink-muted);margin-left:auto}
.g-block,.g-lane{min-height:34px}
.del-info{min-width:0;flex:1}
.del-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;background:none;padding:0;text-align:left;display:block;max-width:100%}
.del-name:hover{color:var(--accent-strong);text-decoration:underline}
.del-stats{display:flex;gap:var(--s2);color:var(--ink-muted);font-size:11px;margin:2px 0 5px;flex-wrap:wrap}
.del-stats b{color:var(--ink);font-weight:600}
.meter{height:6px;border-radius:3px;background:var(--surface-sunken);position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;display:block}
.meter .sch{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.meter .cmp{background:var(--success)}
.caret{border:0;background:none;width:20px;height:20px;border-radius:4px;color:var(--ink-muted);display:grid;place-items:center;padding:0;flex:none}
.caret:hover{background:var(--surface-sunken)}
.caret svg{width:14px;height:14px;transition:transform .12s}.caret[aria-expanded=false] svg{transform:rotate(-90deg)}
.spacer-caret{width:20px;flex:none}
.row-add{margin-left:auto;opacity:0;border:1px dashed var(--line-strong);background:transparent;border-radius:var(--r-sm);padding:1px 8px;font-size:12px;color:var(--accent-strong);font-weight:600}
.g-row:hover .row-add,.row-add:focus-visible{opacity:1}
.bar{position:absolute;height:18px;border-radius:5px;font-size:11px;font-weight:600;padding:0 8px;line-height:16px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent-strong);z-index:1;top:50%;transform:translateY(-50%);border-left-width:3px}
.bar.approx{background:var(--warning-soft);color:var(--warning);border:1px dashed var(--warning)}
.bar.unassigned{background:var(--surface-sunken);color:var(--ink-muted);border:1px dashed var(--line-strong)}
.bar.event{background:var(--warning-soft);color:var(--warning);border-color:var(--warning)}
.del-bar{top:6px;transform:none;pointer-events:none}
.marker{position:absolute;top:50%;transform:translate(-50%,-50%);color:var(--warning);font-size:14px;z-index:1}
.cell{position:relative;border:0;border-right:1px solid var(--line);background:transparent;padding:30px 3px 4px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0;min-height:72px}
.cell.nobar{padding-top:4px}
.cell:hover,.cell:focus-visible{background:var(--accent-soft)}
.cell.now{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.cell.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.cell .plus{position:absolute;top:50%;left:50%;transform:translate(-50%,-30%);opacity:0;font-size:18px;color:var(--accent-strong)}
.cell:hover .plus{opacity:1}
.task{border-left:3px solid var(--c,var(--ink-muted));background:var(--surface-raised);border-radius:4px;padding:2px 5px;box-shadow:0 1px 2px rgba(0,0,0,.14);font-size:11px;line-height:14px;position:relative;overflow:hidden}
.task-top{display:flex;justify-content:space-between;gap:4px;color:var(--ink-muted)}.task-top b{color:var(--ink)}
.task-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task i{position:absolute;left:0;bottom:0;height:2px;background:var(--c)}
.section-label{padding:6px var(--s4);font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-muted);background:var(--surface);border-bottom:1px solid var(--line);position:sticky;left:0}
.undated{padding:var(--s2) var(--s4);background:var(--surface-raised);border-top:1px solid var(--line);display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center}
.legend{display:flex;gap:var(--s4);padding:var(--s2) var(--s4);color:var(--ink-muted);font-size:11px;border-top:1px solid var(--line);background:var(--surface-raised);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:10px;border-radius:3px;display:inline-block}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--c)}
table.t{border-collapse:collapse;width:100%;font-size:12px}
table.t th,table.t td{padding:6px 12px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t thead th{background:var(--surface-sunken);font-weight:700}
table.t .over{color:var(--danger);font-weight:700}
.record{border:1px solid var(--line);border-radius:var(--r-sm);padding:var(--s3);border-left:3px solid var(--c)}
.record-top{display:flex;justify-content:space-between;gap:var(--s2);font-weight:600}
.record-top b{color:var(--accent-strong);font-variant-numeric:tabular-nums}
.record .meter{margin-top:8px}
.record-actions{display:flex;gap:var(--s1);margin-top:var(--s2);flex-wrap:wrap}
.form-block{border-top:1px solid var(--line);padding-top:var(--s3);display:flex;flex-direction:column;gap:var(--s2)}
.quick{width:340px;padding:var(--s3);display:flex;flex-direction:column;gap:var(--s2)}
.quick .rows{display:flex;flex-direction:column;gap:6px;max-height:180px;overflow:auto}
.qrow{display:flex;align-items:center;gap:8px;font-size:12px}
.qrow .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qrow b{font-variant-numeric:tabular-nums;color:var(--ink-muted)}
.qadd{display:grid;grid-template-columns:1fr 90px 60px;gap:6px}

/* ===== Мои задачи ===== */
.tasks-page{overflow:auto;padding:var(--s6) clamp(16px,3vw,40px) 48px;flex:1}
.tasks-wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:var(--s4)}
.tasks-head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s4);flex-wrap:wrap}
.tasks-head p{color:var(--ink-muted);margin-top:2px}
.today-card{display:flex;gap:var(--s6);background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s3) var(--s4)}
.today-card div{display:flex;flex-direction:column}
.today-card strong{font-size:20px;line-height:26px;font-variant-numeric:tabular-nums}
.today-card .warn strong{color:var(--warning)}
.panel{background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.cal-toggle{display:flex;align-items:center;gap:var(--s2);width:100%;border:0;background:transparent;padding:var(--s3) var(--s4);font-weight:600;text-align:left}
.cal-toggle small{color:var(--ink-muted);font-weight:400;text-transform:capitalize}
.cal-toggle svg{width:16px;height:16px;margin-left:auto}
.cal-bar{display:flex;align-items:center;justify-content:space-between;padding:var(--s3) var(--s4);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.cal-bar h2{font-size:15px;line-height:22px;text-transform:capitalize}
.cal-bar div{display:flex;gap:var(--s1)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal .wd{text-align:center;padding:6px;background:var(--surface-sunken);color:var(--ink-muted);font-size:11px;font-weight:700}
.day{min-height:68px;border:0;border-right:1px solid var(--line);border-top:1px solid var(--line);background:var(--surface-raised);padding:6px 8px;text-align:left;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.day:nth-child(7n){border-right:0}
.day:hover{background:var(--surface-sunken)}
.day.out{color:var(--ink-muted);background:var(--surface)}
.day.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12px}
.day.today .num{background:var(--accent);color:var(--on-accent)}
.pills{display:flex;gap:4px;flex-wrap:wrap}
.pill{font-size:11px;line-height:16px;font-weight:600;border-radius:999px;padding:0 7px;white-space:nowrap}
.pill.p{background:var(--accent-soft);color:var(--accent-strong)}
.pill.d{background:var(--success-soft);color:var(--success)}
.pill.w{background:var(--warning-soft);color:var(--warning)}
.board-panel{padding:var(--s4);display:flex;flex-direction:column;gap:var(--s4)}
.board-head{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s3);flex-wrap:wrap}
.board-head h2{font-size:15px;line-height:22px}
.board-actions{display:flex;gap:var(--s1);align-items:center;flex-wrap:wrap}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3)}
.col{background:var(--surface-sunken);border-radius:var(--r-md);padding:var(--s2);min-height:150px;display:flex;flex-direction:column;gap:var(--s2);border:2px solid transparent}
.col.over{border-color:var(--accent);background:var(--accent-soft)}
.col h3{display:flex;align-items:center;gap:var(--s2);padding:var(--s1) var(--s2);font-size:12px;line-height:18px}
.col h3 span{background:var(--surface-raised);border-radius:999px;font-size:11px;padding:0 7px;color:var(--ink-muted)}
.col h3::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink-muted)}
.col[data-s=doing] h3::before{background:var(--accent)}.col[data-s=done] h3::before{background:var(--success)}
.card{background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--r-sm);padding:var(--s2) var(--s3);cursor:grab;display:flex;flex-direction:column;gap:4px}
.card:hover{border-color:var(--line-strong)}
.card.dragging{opacity:.45}
.card-title{border:0;background:none;padding:0;text-align:left;font-weight:600}
.card[data-s=done] .card-title{text-decoration:line-through;color:var(--ink-muted)}
.card p{color:var(--ink-muted);font-size:12px}
.time{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--accent-strong);background:var(--accent-soft);border-radius:999px;padding:0 7px;align-self:flex-start}
.overdue{color:var(--warning);font-size:11px;font-weight:600}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:var(--s2);margin-top:2px}
.card-actions{display:flex;gap:4px;flex-wrap:wrap}
.empty{color:var(--ink-muted);text-align:center;padding:var(--s4) 0;font-size:12px}
/* Предложенный UX: список дня */
.strip{display:flex;align-items:stretch;gap:var(--s2)}
.strip .days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:var(--s2);flex:1}
.sday{border:1px solid var(--line);background:var(--surface-raised);border-radius:var(--r-md);padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.sday:hover{border-color:var(--line-strong)}
.sday .wd{font-size:11px;color:var(--ink-muted);font-weight:600}
.sday .n{font-size:18px;line-height:24px;font-weight:700;font-variant-numeric:tabular-nums}
.sday.today .n{color:var(--accent-strong)}
.sday.sel{background:var(--accent-soft);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.sday.out{opacity:.7}
.sday .pills{margin-top:2px}
.quickadd{display:flex;gap:var(--s2);align-items:center;background:var(--surface-raised);border:1px solid var(--line-strong);border-radius:var(--r-md);padding:6px 6px 6px var(--s3)}
.quickadd:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.quickadd input{border:0;background:transparent;flex:1;outline:0;padding:6px 0;font-size:14px;min-width:0}
.quickadd input::placeholder{color:var(--ink-muted)}
.quickadd .hint{font-size:11px;color:var(--ink-muted);white-space:nowrap}
.sec{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s3);font-weight:700;font-size:12px}
.sec.warn{color:var(--warning)}
.sec button.btn{margin-left:auto}
.list{display:flex;flex-direction:column}
.trow{display:grid;grid-template-columns:54px 22px 1fr auto;gap:var(--s3);align-items:center;padding:8px var(--s3);border-top:1px solid var(--line)}
.trow:hover{background:var(--surface)}
.trow .tm{font-size:12px;font-weight:600;color:var(--ink-muted);font-variant-numeric:tabular-nums}
.check{width:20px;height:20px;border-radius:50%;border:2px solid var(--line-strong);background:transparent;padding:0;display:grid;place-items:center;color:var(--on-accent);font-size:12px;line-height:1}
.check:hover{border-color:var(--success)}
.trow.done .check{background:var(--success);border-color:var(--success)}
.trow.doing .check{border-color:var(--accent);box-shadow:inset 0 0 0 4px var(--accent-soft)}
.trow .tt{text-align:left;border:0;background:none;padding:0;min-width:0}
.trow .tt strong{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow.done .tt strong{text-decoration:line-through;color:var(--ink-muted)}
.trow .tt>span{display:block;color:var(--ink-muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .acts{display:flex;gap:4px;opacity:0}
.trow:hover .acts,.trow:focus-within .acts{opacity:1}
.badge-doing{font-size:11px;font-weight:700;color:var(--accent-strong);background:var(--accent-soft);border-radius:999px;padding:0 7px;margin-left:6px}
@media(max-width:900px){.row2{grid-template-columns:1fr}.board{grid-template-columns:1fr}.strip .days{grid-template-columns:repeat(7,minmax(46px,1fr));overflow-x:auto}.sday .pills{display:none}.trow .acts{opacity:1}}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand"><div class="brand-mark">К</div><div class="brand-text"><strong>Конструктор процессов</strong><small>Прототип редизайна</small></div></div>
    <nav class="nav" aria-label="Разделы">
      <button data-view="plan" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>План проектов</button>
      <button data-view="tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>Мои задачи</button>
    </nav>
    <div class="header-end">
      <div class="seg" role="group" aria-label="Визуальный вариант"><button data-theme-btn="evolution" title="A · Спокойная эволюция">A</button><button data-theme-btn="graphite" title="B · Графит">B</button><button data-theme-btn="paper" title="C · Бумага">C</button></div>
    </div>
  </header>

  <main class="main">
    <section class="view on" id="view-plan"></section>
    <section class="view" id="view-tasks"></section>
  </main>
</div>
<div id="layer"></div>

<script>
(function(){
'use strict';
var DAY=864e5;
function pad(n){return n<10?'0'+n:''+n}
function key(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(k){return new Date(k+'T12:00:00')}
function addDays(d,n){var x=new Date(d.getTime());x.setDate(x.getDate()+n);return x}
function monday(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate(),12);return addDays(x,-((x.getDay()+6)%7))}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var fShort=new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short'});
var fLong=new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long',year:'numeric'});
var fMonth=new Intl.DateTimeFormat('ru-RU',{month:'long',year:'numeric'});
var TODAY=new Date();TODAY=new Date(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate(),12);
var TK=key(TODAY);
function store(n,v){try{if(v===undefined){var s=localStorage.getItem(n);return s?JSON.parse(s):null}localStorage.setItem(n,JSON.stringify(v))}catch(e){return null}}
function $(s,r){return (r||document).querySelector(s)}
function toast(t){var e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(function(){e.remove()},2200)}
var chev='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';

/* ---------- Тема, навигация, UX-режим ---------- */
var themes=['evolution','graphite','paper'];
function setTheme(t){if(themes.indexOf(t)<0)t='evolution';document.documentElement.dataset.theme=t;
  document.querySelectorAll('[data-theme-btn]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.themeBtn===t))});store('proto-theme',t)}
document.querySelectorAll('[data-theme-btn]').forEach(function(b){b.onclick=function(){setTheme(b.dataset.themeBtn)}});
function setView(v){document.querySelectorAll('.view').forEach(function(s){s.classList.toggle('on',s.id==='view-'+v)});
  document.querySelectorAll('[data-view]').forEach(function(b){if(b.dataset.view===v)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  try{history.replaceState(null,'','#'+v)}catch(e){}}
document.querySelectorAll('[data-view]').forEach(function(b){b.onclick=function(){setView(b.dataset.view)}});
var ux={plan:store('proto-ux-plan')||'new',tasks:store('proto-ux-tasks')||'new'};
function uxBar(section,text){return '<div class="ux-bar"><span>Поведение:</span><div class="seg"><button data-ux="'+section+':cur" aria-pressed="'+(ux[section]==='cur')+'">Как сейчас</button><button data-ux="'+section+':new" aria-pressed="'+(ux[section]==='new')+'">Предложено</button></div><span>'+text+'</span></div>'}
document.addEventListener('click',function(e){var b=e.target.closest('[data-ux]');if(!b)return;var p=b.dataset.ux.split(':');ux[p[0]]=p[1];store('proto-ux-'+p[0],p[1]);closeLayer();p[0]==='plan'?renderPlan():renderTasks()});

/* ---------- Слой: модалки и поповеры ---------- */
var layer=$('#layer');
function closeLayer(){layer.innerHTML='';pop=null;modalCtl=null}
var pop=null,modalCtl=null;
function openModal(html,opts){opts=opts||{};layer.innerHTML='<div class="backdrop" data-bd><div class="modal '+(opts.wide?'wide':'')+'" role="dialog" aria-modal="true">'+html+'</div></div>';
  var f=$('input,textarea',layer);if(f&&!opts.noFocus)f.focus();}
layer.addEventListener('mousedown',function(e){if(e.target.hasAttribute('data-bd'))closeLayer()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeLayer()});
document.addEventListener('mousedown',function(e){if(pop&&!e.target.closest('.popover')&&!e.target.closest('[data-pop-owner]'))closeLayer()});
function openPopover(anchor,html,align){var r=anchor.getBoundingClientRect();layer.innerHTML='<div class="popover" role="dialog">'+html+'</div>';var p=$('.popover',layer);pop=p;
  var w=p.offsetWidth,x=align==='right'?r.right-w:r.left;x=Math.max(8,Math.min(x,innerWidth-w-8));var y=r.bottom+6;if(y+p.offsetHeight>innerHeight-8)y=Math.max(8,r.top-p.offsetHeight-6);
  p.style.position='fixed';p.style.left=x+'px';p.style.top=y+'px';var f=$('input',p);if(f)f.focus();return p}

/* =====================================================================
   ПЛАН ПРОЕКТОВ
   ===================================================================== */
var people={a:{name:'Анна',c:'var(--p1)'},b:{name:'Борис',c:'var(--p2)'},v:{name:'Вика',c:'var(--p3)'}};
var lanes=['Разработка','Тестирование'];
var planData=store('proto-plan-v2')||{
 projects:[
  {id:'p1',name:'Платёжный шлюз',status:'В работе'},
  {id:'p2',name:'Мобильное приложение',status:'В работе'}],
 deliveries:[
  {id:'d1',pid:'p1',name:'Интеграция с банком',kind:'Релиз',start:0,end:5,deadline:'exact',test:40,dev:60,
   blocks:[['Разработка','a','API банка',0,3],['Тестирование','b','Сценарии оплаты',3,5]],
   tasks:{0:[['a','Контракт API',6,6]],1:[['a','Подпись запросов',10,10],['b','Песочница',4,4]],2:[['a','Обработка ошибок',12,9]],3:[['b','Тесты сценариев',20,8],['v','Отчёт тестов',5,0]],4:[['b','Регресс',10,0]]}},
  {id:'d2',pid:'p1',name:'Антифрод',kind:'Релиз',start:3,end:9,deadline:'range',test:30,dev:50,
   blocks:[['Разработка',null,'Модель скоринга',4,8]],
   tasks:{3:[['v','Правила v1',8,8]],4:[['v','Правила v2',10,5]],6:[['a','Скоринг',14,0]]}},
  {id:'d3',pid:'p2',name:'Релиз 2.0',kind:'Релиз',start:1,end:7,deadline:'exact',test:60,dev:90,
   blocks:[['Разработка','b','Лента и профиль',1,5],['Тестирование','v','Приёмка',5,7]],
   tasks:{1:[['b','Онбординг',8,8]],2:[['b','Профиль',12,12],['v','Дизайн-ревью',3,3]],3:[['b','Лента',16,11]],5:[['v','Приёмка',20,0]]}},
  {id:'d4',pid:'p2',name:'Push-уведомления',kind:'Поставка',start:6,end:11,deadline:'range',test:0,dev:0,blocks:[],tasks:{}},
  {id:'d5',pid:'p2',name:'Тёмная тема',kind:'Поставка',start:null,end:null,deadline:'unknown',test:0,dev:0,blocks:[],tasks:{}}],
 events:[{label:'Заморозка кода',week:5},{label:'Релиз 2.0',week:8}]
};
var P={n:16,shift:0,query:'',filtersOpen:false,fProject:'',fPerson:'',collapsed:{},sel:null,mode:'weeks',showUndated:true,filtersCount:0};
function origin(){return addDays(monday(TODAY),-14+P.shift*7)}
function wDate(i){return addDays(origin(),i*7)}
function nowIdx(){return Math.round((monday(TODAY)-origin())/(7*DAY))}
function isoWeek(d){var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));var n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);var y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/DAY+1)/7)}
function sums(d){var s=0,c=0;Object.keys(d.tasks).forEach(function(w){d.tasks[w].forEach(function(t){s+=t[2];c+=t[3]})});return {s:s,c:c,total:d.test+d.dev}}
function savePlan(){store('proto-plan-v2',planData)}
function delById(id){return planData.deliveries.filter(function(d){return d.id===id})[0]}
function weekLoad(w){var by={};planData.deliveries.forEach(function(d){(d.tasks[w]||[]).forEach(function(t){var r=by[t[0]]=by[t[0]]||{n:0,c:0};r.n+=t[2];r.c+=t[3]})});return by}
var CAP=40;
function visibleDeliveries(){return planData.deliveries.filter(function(d){
  var p=planData.projects.filter(function(x){return x.id===d.pid})[0];
  if(P.fProject&&d.pid!==P.fProject)return false;
  if(P.fPerson&&!(Object.keys(d.tasks).some(function(w){return d.tasks[w].some(function(t){return t[0]===P.fPerson})})||d.blocks.some(function(b){return b[1]===P.fPerson})))return false;
  if(P.query&&(p.name+' '+d.name).toLowerCase().indexOf(P.query)<0)return false;return true})}
function activeFilters(){return (P.fProject?1:0)+(P.fPerson?1:0)}

function renderPlan(){
  var cur=ux.plan==='cur',el=$('#view-plan'),focus=document.activeElement&&document.activeElement.id;
  var h=uxBar('plan',cur?'Текущая логика: шесть типов объектов в меню «Добавить», настройки периода в панели, задачи недели в модальном окне.':'Предложено: быстрое добавление из строки и ячейки, режимы «Недели / Сроки», полоса нагрузки, компактный период.');
  h+='<div class="plan-toolbar"><div class="titles"><h1 class="page-title display">План проектов</h1><p>Недельный обзор поставок и работы</p></div>'
   +'<input class="input search" id="q" type="search" placeholder="Поиск по плану" aria-label="Поиск по плану" value="'+esc(P.query)+'">'
   +'<button class="btn" id="b-filters" aria-expanded="'+P.filtersOpen+'">Фильтры'+(activeFilters()?' <span class="count-badge">'+activeFilters()+'</span>':'')+'</button>'
   +(activeFilters()?'<button class="btn ghost" id="b-reset">Сбросить</button>':'');
  if(!cur)h+='<div class="seg" role="group" aria-label="Режим"><button data-mode="weeks" aria-pressed="'+(P.mode==='weeks')+'">Недели</button><button data-mode="dates" aria-pressed="'+(P.mode==='dates')+'">Сроки</button></div>';
  h+='<span class="menu-wrap">'+(cur?'<button class="btn primary" id="b-add" data-pop-owner>+ Добавить</button>':'<button class="btn primary" id="b-add" data-pop-owner>+ Задача недели</button><button class="btn" id="b-add2" data-pop-owner>Ещё объект ▾</button>')+'</span>'
   +'<span class="menu-wrap"><button class="btn" id="b-more" data-pop-owner>Ещё ▾</button></span></div>';
  if(P.filtersOpen)h+='<div class="filters"><select class="input" id="f-project" aria-label="Проект"><option value="">Все проекты</option>'+planData.projects.map(function(p){return '<option value="'+p.id+'"'+(P.fProject===p.id?' selected':'')+'>'+esc(p.name)+'</option>'}).join('')+'</select><select class="input" id="f-person" aria-label="Человек"><option value="">Все люди</option>'+Object.keys(people).map(function(k){return '<option value="'+k+'"'+(P.fPerson===k?' selected':'')+'>'+people[k].name+'</option>'}).join('')+'</select></div>';
  h+='<div class="period"><button class="btn icon" id="prev" aria-label="Раньше">←</button><button class="btn" id="to-today">Сегодня</button><button class="btn icon" id="next" aria-label="Позже">→</button>';
  if(cur)h+='<label>С недели <input class="input" type="date" value="'+key(origin())+'" id="from"></label><label>Период <select class="input" id="n">'+[8,16,24,32].map(function(n){return '<option value="'+n+'"'+(P.n===n?' selected':'')+'>'+n+' недель</option>'}).join('')+'</select></label><button class="btn" id="fit">Уместить план</button>';
  else h+='<div class="seg" role="group" aria-label="Масштаб">'+[8,16,24].map(function(n){return '<button data-n="'+n+'" aria-pressed="'+(P.n===n)+'">'+n+' нед.</button>'}).join('')+'</div>';
  h+='<span class="caption">'+fShort.format(wDate(0))+' – '+fShort.format(addDays(wDate(P.n-1),4))+' · '+wDate(0).getFullYear()+'</span></div>';
  h+='<div class="plan-body"><div class="plan-scroll"><div class="grid" style="--n:'+P.n+'">'+gridHtml(cur)+'</div></div>';
  var und=planData.deliveries.filter(function(d){return d.deadline==='unknown'});
  if(und.length)h+=P.showUndated?'<div class="undated"><strong>Без срока</strong>'+und.map(function(d){return '<button class="btn sm" data-edit-del="'+d.id+'">'+esc(delProject(d).name)+' · '+esc(d.name)+'</button>'}).join('')+'<button class="btn ghost sm" id="hide-und" style="margin-left:auto">Скрыть</button></div>':'<div class="undated"><button class="btn ghost sm" id="show-und">Показать без срока ('+und.length+')</button></div>';
  h+='<div class="legend"><span><i style="background:var(--accent-soft);border:1px solid var(--accent)"></i>Рабочий блок</span><span><i style="background:var(--surface-sunken);border:1px dashed var(--line-strong)"></i>Не назначено</span><span><i style="background:var(--warning-soft);border:1px dashed var(--warning)"></i>Приблизительный срок</span><span><i style="background:var(--surface-raised);border-left:3px solid var(--p1)"></i>Недельная задача</span><span style="color:var(--warning)">◆ Событие</span></div></div>';
  el.innerHTML=h;bindPlan();
  if(focus==='q'){var q=$('#q');q.focus();q.setSelectionRange(q.value.length,q.value.length)}
}
function delProject(d){return planData.projects.filter(function(p){return p.id===d.pid})[0]}
function gridHtml(cur){
  var now=nowIdx(),n=P.n,h='';
  h+='<div class="g-row g-head"><div class="g-label overline">Объекты плана</div><div class="weeks">';
  for(var i=0;i<n;i++){var d=wDate(i);h+='<button class="wk-h '+(i===now?'now':'')+'" data-wk="'+i+'" title="Нагрузка недели №'+isoWeek(d)+'"><strong>'+fShort.format(d).replace('.','')+'</strong><small>№'+isoWeek(d)+'</small></button>'}
  h+='</div></div>';
  if(!cur){
    h+='<div class="g-row g-load"><div class="g-label">Нагрузка команды</div><div class="weeks">';
    for(var j=0;j<n;j++){var by=weekLoad(j),tot=0;Object.keys(by).forEach(function(k){tot+=by[k].n});var cap=CAP*Object.keys(people).length,pc=tot/cap,max=0;Object.keys(by).forEach(function(k){max=Math.max(max,by[k].n/CAP)});
      var cls=!tot?'zero':max>1?'bad':max>.8?'warn':'';
      h+='<button class="load '+cls+'" data-wk="'+j+'" title="'+(tot?Object.keys(by).map(function(k){return people[k].name+': '+Math.round(by[k].n/CAP*100)+'%'}).join('\n'):'Задач нет')+'"><i style="--p:'+Math.min(100,Math.round(pc*100*1.6))+'%"></i></button>'}
    h+='</div></div>';
  }
  var dels=visibleDeliveries(),shown=0;
  planData.projects.forEach(function(p){
    var pd=dels.filter(function(d){return d.pid===p.id});if(!pd.length)return;shown++;
    var open=!P.collapsed[p.id];
    h+='<div class="g-row g-project"><div class="g-label"><button class="caret" data-toggle="'+p.id+'" aria-expanded="'+open+'" aria-label="'+(open?'Свернуть':'Развернуть')+'">'+chev+'</button><span>'+esc(p.name)+'</span><span class="caption" style="font-weight:400">'+(cur?esc(p.status):'')+'</span>'+(cur?'':'<button class="row-add" data-add="delivery:'+p.id+'">+ поставка</button>')+'</div><div class="weeks"></div></div>';
    if(!open)return;
    pd.forEach(function(d){
      var m=sums(d),pct=function(v){return m.total?Math.min(100,v/m.total*100):0};

        +'<div class="del-stats"><span>'+esc(d.kind)+' · '+deadlineText(d)+'</span></div>'
        +(m.total?'<div class="del-stats"><span>Объём <b>'+m.total+'</b></span><span>План <b>'+m.s+'</b></span><span>Готово <b>'+m.c+'</b></span></div>':'<div class="del-stats"><span>Объём не задан</span></div>')
        +'<div class="meter" role="img" aria-label="Распределено '+m.s+' из '+(m.total||'—')+', выполнено '+m.c+'"><i class="sch" style="width:'+pct(m.s)+'%"></i><i class="cmp" style="width:'+pct(m.c)+'%"></i></div></div></div><div class="weeks">';
      if(d.start!==null){
        if(cur||P.mode==='dates'){h+='<div class="bar del-bar '+(d.deadline==='range'?'approx':'')+'" style="left:calc('+d.start+'/'+n+'*100% + 3px);width:calc('+(Math.min(d.end,n-1)-d.start+1)+'/'+n+'*100% - 6px)">'+(d.deadline==='range'?'≈ ':'')+'срок '+fShort.format(addDays(wDate(d.end),4))+'</div>'}
      }

        if(!showCells){h+='<span style="border-right:1px solid var(--line)"></span>';continue}

        list.forEach(function(t){h+='<span class="task" style="--c:'+people[t[0]].c+'"><span class="task-top"><span>'+people[t[0]].name+'</span><b>'+t[3]+'/'+t[2]+'</b></span><span class="task-title">'+esc(t[1])+'</span><i style="width:'+(t[2]?t[3]/t[2]*100:0)+'%"></i></span>'});
        if(!list.length)h+='<span class="plus">+</span>';
        h+='</button>';
      }
      h+='</div></div>';
      if(showBars&&d.blocks.length&&(cur||P.mode==='dates')){
        lanes.forEach(function(ln){
          var bl=d.blocks.filter(function(b){return b[0]===ln});if(!bl.length)return;
          h+='<div class="g-row g-lane"><div class="g-label">'+esc(ln)+'<small class="caption" style="margin-left:auto;font-weight:400">'+bl.length+' бл.</small></div><div class="weeks"></div></div>';
          bl.forEach(function(b){h+='<div class="g-row g-block"><div class="g-label">'+(b[1]?esc(people[b[1]].name):'Не назначено')+'<small>'+esc(b[2])+'</small></div><div class="weeks"><button class="bar '+(b[1]?'':'unassigned')+'" data-edit-block="1" style="left:calc('+b[3]+'/'+n+'*100% + 3px);width:calc('+(b[4]-b[3]+1)+'/'+n+'*100% - 6px)" title="'+esc(b[2])+'">'+esc(b[2])+'</button></div></div>'});
        });
      }
    });
  });
  if(!shown)h+='<div style="padding:32px;text-align:center;color:var(--ink-muted)">Ничего не найдено.</div>';
  else if(cur||P.mode==='dates'){
    h+='<div class="section-label">События</div>';
    planData.events.forEach(function(ev){h+='<div class="g-row"><div class="g-label"><span class="spacer-caret"></span>Событие<small class="caption" style="margin-left:auto">'+esc(ev.label)+'</small></div><div class="weeks" style="min-height:34px"><span class="marker" style="left:calc('+(ev.week+.5)+'/'+n+'*100%)" title="'+esc(ev.label)+'">◆</span></div></div>'});
  }
  return h;
}

function planClick(e){
  var t=e.target;

  var ed=t.closest('[data-edit-del]');if(ed){entityModal('delivery',null,ed.dataset.editDel);return}

];
var T={sel:TK,month:new Date(TODAY.getFullYear(),TODAY.getMonth(),1,12),calOpen:false,view:'list',doneOpen:false,nextId:100};
function saveTasks(){store('proto-tasks-v2',tasks)}
function forDay(date){return tasks.filter(function(t){if(t.status==='done')return t.completed===date;return t.planned===date||(date===TK&&t.planned<TK)})}
function monthGrid(){var first=new Date(T.month.getFullYear(),T.month.getMonth(),1,12),start=monday(first),last=new Date(T.month.getFullYear(),T.month.getMonth()+1,0,12),n=Math.ceil(((monday(last)-start)/DAY+7)/7)*7,o=[];
  for(var i=0;i<n;i++){var d=addDays(start,i);o.push({k:key(d),n:d.getDate(),in:d.getMonth()===T.month.getMonth()})}return o}
function counts(date){var e=forDay(date),p=e.filter(function(t){return t.status!=='done'}).length;return {p:p,d:e.length-p}}
function sortT(a,b){return (a.time||'99:99').localeCompare(b.time||'99:99')||a.id-b.id}
function pills(c){return (c.p?'<span class="pill p">'+c.p+' дел</span>':'')+(c.d?'<span class="pill d">'+c.d+' готово</span>':'')}

function renderTasks(){
  var cur=ux.tasks==='cur',el=$('#view-tasks');
  var day=forDay(T.sel),carried=tasks.filter(function(t){return t.status!=='done'&&t.planned<TK}).length,td=forDay(TK),act=td.filter(function(t){return t.status!=='done'}).length;
  var h=uxBar('tasks',cur?'Текущая логика: календарь за переключателем, доска из трёх колонок, добавление через окно.':'Предложено: неделя вместо календаря, список дня по времени, быстрый ввод по Enter, доска — по желанию.');
  h+='<div class="tasks-page"><div class="tasks-wrap">';
  h+='<div class="tasks-head"><div><div class="overline">Личное пространство</div><h1 class="page-title display" style="margin-top:4px">Мои задачи</h1><p>План на каждый день. Незавершённые дела автоматически видны сегодня.</p></div><div class="today-card"><div><span class="caption">В планах сегодня</span><strong>'+act+'</strong></div><div><span class="caption">Сделано</span><strong style="color:var(--success)">'+(td.length-act)+'</strong></div>'+(carried?'<div class="warn"><span class="caption">Перенесено</span><strong>'+carried+'</strong></div>':'')+'</div></div>';
  if(cur)h+=curTasks(day,carried);else h+=newTasks(day,carried);
  h+='</div></div>';
  el.innerHTML=h;bindTasks();
}
function calendarHtml(){
  var h='<div class="cal-bar"><h2 class="display">'+fMonth.format(T.month).replace(' г.','')+'</h2><div><button class="btn icon" data-m="-1" aria-label="Предыдущий месяц">←</button><button class="btn" data-m="0">Сегодня</button><button class="btn icon" data-m="1" aria-label="Следующий месяц">→</button></div></div><div class="cal">';
  wdays.forEach(function(w){h+='<div class="wd">'+w+'</div>'});
  monthGrid().forEach(function(d){h+='<button class="day '+(d.in?'':'out')+(d.k===TK?' today':'')+(d.k===T.sel?' sel':'')+'" data-day="'+d.k+'" aria-pressed="'+(d.k===T.sel)+'"><span class="num">'+d.n+'</span><span class="pills">'+pills(counts(d.k))+'</span></button>'});
  return h+'</div>';
}
function cardHtml(t){
  return '<article class="card" draggable="true" data-id="'+t.id+'" data-s="'+t.status+'">'+(t.time?'<span class="time">🕒 '+t.time+'</span>':'')+'<button class="card-title" data-edit="'+t.id+'" title="Редактировать">'+esc(t.title)+'</button>'+(t.note?'<p>'+esc(t.note)+'</p>':'')+(t.status!=='done'&&t.planned<TK?'<span class="overdue">С '+fLong.format(parse(t.planned))+'</span>':'')
   +'<div class="card-foot"><div class="card-actions">'+ACT[t.status].map(function(a){return '<button class="btn sm'+(a[0]==='done'?' primary':'')+'" data-move="'+t.id+':'+a[0]+'" aria-label="'+a[1]+': '+esc(t.title)+'">'+a[1]+'</button>'}).join('')+'</div><button class="btn ghost sm" data-remove="'+t.id+'" aria-label="Удалить: '+esc(t.title)+'" style="color:var(--danger)">Удалить</button></div></article>';
}
function boardHtml(day){
  var h='<div class="board">';
  STAT.forEach(function(s){var items=day.filter(function(t){return t.status===s[0]}).sort(sortT);
    h+='<section class="col" data-s="'+s[0]+'" aria-label="'+s[1]+'"><h3>'+s[1]+'<span>'+items.length+'</span></h3>'+(items.length?'':'<p class="empty">Пока пусто</p>')+items.map(cardHtml).join('')+'</section>'});
  return h+'</div>';
}
function dayNav(carried){
  return '<div class="board-head"><div><div class="overline">Доска дня</div><h2 class="display">'+fLong.format(parse(T.sel))+'</h2><span class="caption">'+forDay(T.sel).length+' задач'+(T.sel===TK&&carried?' · '+carried+' перенесено':'')+'</span></div><div class="board-actions"><button class="btn icon" data-day-shift="-1" aria-label="Предыдущий день">←</button><button class="btn" data-day-today>Сегодня</button><button class="btn icon" data-day-shift="1" aria-label="Следующий день">→</button><button class="btn primary" data-open-add>+ Добавить задачу</button></div></div>';
}
function curTasks(day,carried){
  var h='<div class="panel"><button class="cal-toggle" id="cal-toggle" aria-expanded="'+T.calOpen+'">📅 Календарь <small>'+fMonth.format(T.month).replace(' г.','')+'</small>'+chev+'</button>'+(T.calOpen?calendarHtml():'')+'</div>';
  h+='<div class="panel board-panel">'+dayNav(carried)+boardHtml(day)+'</div>';
  return h;
}
function newTasks(day,carried){
  var ws=monday(parse(T.sel)),h='';
  h+='<div class="strip"><button class="btn icon" data-week-shift="-1" aria-label="Предыдущая неделя" style="align-self:center">←</button><div class="days">';
  for(var i=0;i<7;i++){var d=addDays(ws,i),k=key(d),c=counts(k);
    h+='<button class="sday '+(k===TK?'today ':'')+(k===T.sel?'sel':'')+'" data-day="'+k+'" aria-pressed="'+(k===T.sel)+'"><span class="wd">'+wdays[i]+'</span><span class="n">'+d.getDate()+'</span><span class="pills">'+pills(c)+'</span></button>'}
  h+='</div><button class="btn icon" data-week-shift="1" aria-label="Следующая неделя" style="align-self:center">→</button><button class="btn" id="cal-toggle" aria-expanded="'+T.calOpen+'" style="align-self:center">Месяц</button></div>';
  if(T.calOpen)h+='<div class="panel">'+calendarHtml()+'</div>';
  h+='<form class="quickadd" id="qa"><span aria-hidden="true">＋</span><input name="title" placeholder="Новая задача на '+(T.sel===TK?'сегодня':fShort.format(parse(T.sel)))+'… например: 14:30 Созвон с банком" maxlength="200" autocomplete="off" aria-label="Новая задача"><span class="hint">Enter — добавить</span><button type="button" class="btn" data-open-add>Подробнее</button></form>';
  h+='<div class="panel"><div class="sec" style="border-bottom:1px solid var(--line)"><span class="display" style="font-size:15px">'+(T.sel===TK?'Сегодня, ':'')+fLong.format(parse(T.sel))+'</span><span class="caption" style="font-weight:400">'+day.length+' задач</span><div class="seg" style="margin-left:auto"><button data-tview="list" aria-pressed="'+(T.view==='list')+'">Список</button><button data-tview="board" aria-pressed="'+(T.view==='board')+'">Доска</button></div></div>';
  if(T.view==='board'){h+='<div class="board-panel">'+boardHtml(day)+'</div>'}
  else{
    var over=T.sel===TK?tasks.filter(function(t){return t.status!=='done'&&t.planned<TK}).sort(sortT):[];
    var open=day.filter(function(t){return t.status!=='done'&&t.planned>=T.sel||(t.status!=='done'&&T.sel!==TK)}).sort(sortT);
    var dn=day.filter(function(t){return t.status==='done'});
    if(over.length)h+='<div class="sec warn">⚠ Перенесено с прошлых дней <span class="caption" style="font-weight:400">'+over.length+'</span><button class="btn sm" data-all-today>Перенести все на сегодня</button></div><div class="list">'+over.map(rowHtml).join('')+'</div>';
    h+='<div class="sec">Запланировано <span class="caption" style="font-weight:400">'+open.length+'</span></div><div class="list">'+(open.length?open.map(rowHtml).join(''):'<p class="empty">На этот день ничего не запланировано. Добавьте задачу строкой выше.</p>')+'</div>';
    if(dn.length)h+='<button class="sec" id="done-toggle" style="border:0;background:none;width:100%;text-align:left;border-top:1px solid var(--line)">Сделано <span class="caption" style="font-weight:400">'+dn.length+'</span><span style="margin-left:auto;transform:rotate('+(T.doneOpen?0:-90)+'deg)">'+chev.replace('<svg','<svg width="14" height="14"')+'</span></button>'+(T.doneOpen?'<div class="list">'+dn.map(rowHtml).join('')+'</div>':'');
  }
  return h+'</div>';
}
function rowHtml(t){
  return '<div class="trow '+t.status+'" data-id="'+t.id+'"><span class="tm">'+(t.time||'')+'</span><button class="check" data-toggle-done="'+t.id+'" aria-label="'+(t.status==='done'?'Вернуть в план':'Готово')+': '+esc(t.title)+'">'+(t.status==='done'?'✓':'')+'</button><button class="tt" data-edit="'+t.id+'"><strong>'+esc(t.title)+(t.status==='doing'?'<span class="badge-doing">В работе</span>':'')+'</strong>'+(t.note||t.planned<TK&&t.status!=='done'?'<span>'+(t.planned<TK&&t.status!=='done'?'С '+fLong.format(parse(t.planned))+(t.note?' · ':''):'')+esc(t.note)+'</span>':'')+'</button><div class="acts">'
    +(t.status!=='done'?'<button class="btn sm" data-move="'+t.id+':'+(t.status==='doing'?'todo':'doing')+'">'+(t.status==='doing'?'В план':'В работу')+'</button>':'')
    +'<button class="btn ghost sm" data-remove="'+t.id+'" aria-label="Удалить: '+esc(t.title)+'" style="color:var(--danger)">Удалить</button></div></div>';
}
function moveTask(id,s){tasks.forEach(function(t){if(t.id===id){t.status=s;if(s==='done')t.completed=TK;else delete t.completed}});saveTasks();renderTasks()}
function taskModal(id){
  var t=id?tasks.filter(function(x){return x.id===id})[0]:null;
  openModal('<div class="modal-head"><div><div class="overline">'+(t?'Редактирование задачи':'Новая задача')+'</div><h2 class="display">'+(t?'Изменить задачу':'Добавить задачу')+'</h2></div><button class="btn ghost icon" data-close aria-label="Закрыть окно">✕</button></div><form id="tf" style="display:flex;flex-direction:column;gap:12px"><label class="field">Название задачи<input class="input" name="title" required maxlength="200" placeholder="Что нужно сделать?" value="'+(t?esc(t.title):'')+'"></label><div class="row2"><label class="field">Дата<input class="input" type="date" name="date" required value="'+(t?t.planned:(T.sel>TK?T.sel:TK))+'"></label><label class="field">Время (необязательно)<input class="input" type="time" name="time" value="'+(t&&t.time?t.time:'')+'"></label></div><label class="field">Описание и заметки<textarea class="input" name="note" rows="5" maxlength="4000" placeholder="Контекст, шаги или ссылки">'+(t?esc(t.note):'')+'</textarea></label><div class="modal-actions">'+(t?'<button type="button" class="btn danger" data-del style="margin-right:auto">Удалить</button>':'')+'<button type="button" class="btn" data-close>Отмена</button><button class="btn primary">'+(t?'Сохранить':'Добавить задачу')+'</button></div></form>');
  bindClose();
  var dl=$('[data-del]',layer);if(dl)dl.onclick=function(){if(confirm('Удалить задачу «'+t.title+'»?')){tasks=tasks.filter(function(x){return x!==t});saveTasks();closeLayer();renderTasks()}};
  $('#tf',layer).onsubmit=function(e){e.preventDefault();var f=e.target,title=f.title.value.trim();if(!title)return;
    if(t){t.title=title;t.note=f.note.value.trim();t.planned=f.date.value;t.time=f.time.value}
    else tasks.push({id:T.nextId++,title:title,note:f.note.value.trim(),planned:f.date.value,time:f.time.value,status:'todo'});
    saveTasks();closeLayer();renderTasks()};
}
function bindTasks(){
  var el=$('#view-tasks'),dragId=null;
  var qa=$('#qa',el);if(qa)qa.onsubmit=function(e){e.preventDefault();var v=qa.title.value.trim();if(!v)return;
    var tm='',m=v.match(/^(\d{1,2})[:.](\d{2})\s+(.+)$/);if(m){tm=pad(+m[1])+':'+m[2];v=m[3]}
    tasks.push({id:T.nextId++,title:v,note:'',planned:T.sel<TK?TK:T.sel,time:tm,status:'todo'});saveTasks();renderTasks();var q=$('#qa input');if(q)q.focus()};
  el.onclick=function(e){var t=e.target,b;
    if(t.closest('#cal-toggle')){T.calOpen=!T.calOpen;renderTasks();return}
    if((b=t.closest('[data-m]'))){var m=+b.dataset.m;T.month=m===0?new Date(TODAY.getFullYear(),TODAY.getMonth(),1,12):new Date(T.month.getFullYear(),T.month.getMonth()+m,1,12);if(m===0)T.sel=TK;renderTasks();return}
    if((b=t.closest('[data-day]'))){T.sel=b.dataset.day;T.month=new Date(parse(T.sel).getFullYear(),parse(T.sel).getMonth(),1,12);renderTasks();return}
    if((b=t.closest('[data-day-shift]'))){T.sel=key(addDays(parse(T.sel),+b.dataset.dayShift));T.month=new Date(parse(T.sel).getFullYear(),parse(T.sel).getMonth(),1,12);renderTasks();return}
    if((b=t.closest('[data-week-shift]'))){T.sel=key(addDays(parse(T.sel),7*+b.dataset.weekShift));renderTasks();return}
    if(t.closest('[data-day-today]')){T.sel=TK;T.month=new Date(TODAY.getFullYear(),TODAY.getMonth(),1,12);renderTasks();return}
    if(t.closest('[data-open-add]')){taskModal();return}
    if((b=t.closest('[data-edit]'))){taskModal(+b.dataset.edit);return}
    if((b=t.closest('[data-move]'))){var p=b.dataset.move.split(':');moveTask(+p[0],p[1]);return}
    if((b=t.closest('[data-toggle-done]'))){var id=+b.dataset.toggleDone,tk=tasks.filter(function(x){return x.id===id})[0];moveTask(id,tk.status==='done'?'todo':'done');return}
    if((b=t.closest('[data-remove]'))){var rid=+b.dataset.remove,rt=tasks.filter(function(x){return x.id===rid})[0];if(confirm('Удалить задачу «'+rt.title+'»?')){tasks=tasks.filter(function(x){return x.id!==rid});saveTasks();renderTasks()}return}
    if((b=t.closest('[data-tview]'))){T.view=b.dataset.tview;renderTasks();return}
    if(t.closest('#done-toggle')){T.doneOpen=!T.doneOpen;renderTasks();return}
    if(t.closest('[data-all-today]')){tasks.forEach(function(x){if(x.status!=='done'&&x.planned<TK)x.planned=TK});saveTasks();renderTasks();toast('Задачи перенесены на сегодня')}
  };
  el.ondragstart=function(e){var c=e.target.closest('.card');if(!c)return;dragId=+c.dataset.id;c.classList.add('dragging');e.dataTransfer.setData('text/plain',String(dragId));e.dataTransfer.effectAllowed='move'};
  el.ondragend=function(){dragId=null;el.querySelectorAll('.dragging,.over').forEach(function(x){x.classList.remove('dragging','over')})};
  el.ondragover=function(e){var c=e.target.closest('.col');if(c){e.preventDefault();c.classList.add('over')}};
  el.ondragleave=function(e){var c=e.target.closest('.col');if(c&&!c.contains(e.relatedTarget))c.classList.remove('over')};
  el.ondrop=function(e){var c=e.target.closest('.col');if(!c)return;e.preventDefault();var id=+e.dataTransfer.getData('text/plain')||dragId;if(id)moveTask(id,c.dataset.s)};
}

/* ---------- Старт ---------- */
var q=new URLSearchParams(location.search);
if(q.get('ux')){ux.plan=ux.tasks=q.get('ux')}
setTheme(q.get('theme')||store('proto-theme')||'evolution');
renderPlan();renderTasks();
setView((location.hash||'#plan').slice(1)==='tasks'?'tasks':'plan');
})();
</script>
</body>
