<!doctype html>
<html lang="ru" data-theme="evolution">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Прототип редизайна · План проектов и Мои задачи</title>
<style>
/* ===== Токены (из дизайн-системы «Конструктор процессов») ===== */
:root,[data-theme="evolution"]{
  --surface:#f7f8fa;--surface-raised:#ffffff;--surface-sunken:#eef1f5;--line:#e4e8ee;--line-strong:#c3ccd8;
  --ink:#17212f;--ink-muted:#5f6b7a;--accent:#2563eb;--on-accent:#ffffff;--accent-soft:#eaf1ff;--accent-strong:#1d4ed8;
  --danger:#b42318;--danger-soft:#fff1ef;--success:#16794a;--success-soft:#e3f4ea;--warning:#9a5b00;--warning-soft:#fdf1dc;--scrim:#17212f70;
  --p1:#2f7de1;--p2:#c2502b;--p3:#2c8a62;
  --shadow-popover:0 12px 36px rgba(23,33,47,.1);--shadow-modal:0 24px 90px rgba(7,17,30,.3);
  --font-display:Inter,ui-sans-serif,-apple-system,"Segoe UI",sans-serif;
}
[data-theme="graphite"]{
  --surface:#14181f;--surface-raised:#1c222b;--surface-sunken:#0f1218;--line:#2c3440;--line-strong:#4a5565;
  --ink:#e8ecf2;--ink-muted:#9aa6b6;--accent:#6aa2ff;--on-accent:#0b1220;--accent-soft:#26385c;--accent-strong:#9bc0ff;
  --danger:#ff8a80;--danger-soft:#3a1f1d;--success:#5fd38d;--success-soft:#1c3a2b;--warning:#f0b44c;--warning-soft:#3a2f17;--scrim:#00000099;
  --p1:#6aa2ff;--p2:#ff9b6b;--p3:#5fd38d;
  --shadow-popover:0 12px 36px rgba(0,0,0,.5);--shadow-modal:0 24px 90px rgba(0,0,0,.6);
}
[data-theme="paper"]{
  --surface:#f6f1e7;--surface-raised:#fffdf8;--surface-sunken:#ece5d6;--line:#ddd3bf;--line-strong:#bfb298;
  --ink:#2a2218;--ink-muted:#6b5f4d;--accent:#1f6f5c;--on-accent:#fffdf8;--accent-soft:#dcebe4;--accent-strong:#17594a;
  --danger:#a3341f;--danger-soft:#f7e2dc;--success:#2d6a3e;--success-soft:#dcebdd;--warning:#8a5a00;--warning-soft:#f5e6c5;--scrim:#2a221870;
  --p1:#2b6cb0;--p2:#b5532a;--p3:#2d6a3e;
  --shadow-popover:0 8px 24px rgba(42,34,24,.12);--shadow-modal:0 24px 80px rgba(42,34,24,.3);
  --font-display:"Source Serif 4",Georgia,"Times New Roman",serif;
}
:root{--r-sm:6px;--r-md:10px;--r-lg:16px;--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s6:24px}

/* ===== База ===== */
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/20px Inter,ui-sans-serif,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--surface);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.display{font-family:var(--font-display)}
[data-theme="paper"] .display{font-weight:600}

/* Кнопки: одна система вместо .quiet-button/.pv-btn/.danger-button */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface-raised);color:var(--ink);border-radius:var(--r-sm);padding:6px 12px;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--surface-sunken)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.icon{padding:6px 8px}
.field{display:flex;flex-direction:column;gap:var(--s1);font-size:11px;font-weight:600;color:var(--ink-muted)}
.input{border:1px solid var(--line-strong);background:var(--surface-raised);border-radius:var(--r-sm);padding:7px 10px;font-weight:400;font-size:13px;color:var(--ink);min-width:0}
.input::placeholder{color:var(--ink-muted)}
.overline{font-size:11px;line-height:16px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-muted)}
.caption{font-size:11px;line-height:16px;color:var(--ink-muted)}
.page-title{font-size:20px;line-height:28px;font-weight:700;letter-spacing:-.01em}
[data-theme="paper"] .page-title{font-size:24px;line-height:30px}

/* ===== Каркас ===== */
.app{display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(0,1fr);height:100%}
.header{display:flex;align-items:center;gap:var(--s6);padding:0 var(--s4);height:56px;background:var(--surface-raised);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:210px}
.brand-mark{width:30px;height:30px;border-radius:var(--r-md);background:var(--ink);color:var(--surface-raised);display:grid;place-items:center;font-weight:800;font-size:14px}
.brand strong{display:block;font-size:13px;line-height:16px}.brand small{display:block;font-size:11px;line-height:14px;color:var(--ink-muted)}
.nav{display:flex;gap:2px}
.nav button{display:flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--ink-muted);padding:8px 12px;border-radius:var(--r-sm);font-weight:600;position:relative}
.nav button:hover{background:var(--surface-sunken);color:var(--ink)}
.nav button[aria-current=page]{color:var(--accent-strong);background:var(--accent-soft)}
.nav svg{width:16px;height:16px;flex:none}
.header-end{margin-left:auto;display:flex;gap:var(--s2);align-items:center}
.theme-switch{display:flex;background:var(--surface-sunken);border-radius:var(--r-sm);padding:2px}
.theme-switch button{border:0;background:transparent;padding:4px 10px;border-radius:5px;font-weight:600;font-size:12px;color:var(--ink-muted)}
.theme-switch button[aria-pressed=true]{background:var(--surface-raised);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.main{min-height:0;min-width:0;display:flex;flex-direction:column}
.view{display:none;min-height:0;flex:1}
.view.on{display:flex;flex-direction:column}

/* Вариант B: боковая навигация */
[data-theme="graphite"] .app{grid-template-rows:1fr;grid-template-columns:200px minmax(0,1fr)}
[data-theme="graphite"] .header{flex-direction:column;align-items:stretch;height:auto;gap:var(--s4);padding:var(--s4) var(--s3);border-bottom:0;border-right:1px solid var(--line)}
[data-theme="graphite"] .nav{flex-direction:column}
[data-theme="graphite"] .nav button{padding:9px 10px}
[data-theme="graphite"] .header-end{margin:auto 0 0;flex-direction:column;align-items:stretch}
[data-theme="graphite"] .brand{min-width:0}
@media(max-width:900px){
  [data-theme="graphite"] .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  [data-theme="graphite"] .header{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}
  [data-theme="graphite"] .nav{flex-direction:row}[data-theme="graphite"] .header-end{margin:0 0 0 auto;flex-direction:row}
  .brand small,.brand-text{display:none}.brand{min-width:0}
  .header{gap:var(--s2);overflow-x:auto}
}

/* ===== План проектов ===== */
.plan-toolbar{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);background:var(--surface-raised);border-bottom:1px solid var(--line);flex-wrap:wrap}
.plan-toolbar .titles{margin-right:auto}
.plan-toolbar .titles p{color:var(--ink-muted);font-size:12px}
.search{width:200px}
.chip-filter{display:inline-flex;align-items:center;gap:6px}
.count-badge{background:var(--accent);color:var(--on-accent);border-radius:999px;font-size:10px;line-height:16px;min-width:16px;text-align:center;padding:0 4px}
.period{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s4);border-bottom:1px solid var(--line);background:var(--surface-raised)}
.period .caption{margin-left:var(--s2)}
.plan-body{display:flex;flex:1;min-height:0;min-width:0}
.plan-scroll{flex:1;overflow:auto;min-width:0}
.grid{min-width:calc(280px + 12*88px)}
.g-row{display:grid;grid-template-columns:280px 1fr;border-bottom:1px solid var(--line)}
.g-label{position:sticky;left:0;z-index:3;background:var(--surface-raised);border-right:1px solid var(--line);padding:var(--s2) var(--s3);display:flex;align-items:center;gap:var(--s2);min-width:0}
.g-head{position:sticky;top:0;z-index:5;background:var(--surface-raised)}
.g-head .g-label{align-items:flex-end;z-index:6}
.weeks{display:grid;grid-template-columns:repeat(12,1fr);position:relative}
.wk-h{padding:6px 4px;text-align:center;border-right:1px solid var(--line);background:var(--surface-raised);color:var(--ink-muted);border-top:0;border-bottom:0;border-left:0;display:flex;flex-direction:column;align-items:center;line-height:15px}
.wk-h:hover{background:var(--surface-sunken)}
.wk-h strong{font-size:11px;color:var(--ink)}.wk-h small{font-size:10px}
.wk-h.now{background:var(--accent-soft);box-shadow:inset 0 -3px var(--accent)}
.wk-h.now strong{color:var(--accent-strong)}
.g-project .g-label{background:var(--surface-sunken);font-weight:700}
.g-project .weeks{background:var(--surface-sunken)}
.proj-bar{position:absolute;top:50%;transform:translateY(-50%);height:12px;border-radius:999px;background:var(--line-strong)}
.g-del{min-height:72px}
.del-info{min-width:0;flex:1;padding-left:var(--s4)}
.del-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;background:none;padding:0;text-align:left;display:block;max-width:100%}
.del-name:hover{color:var(--accent-strong);text-decoration:underline}
.del-stats{display:flex;gap:var(--s2);color:var(--ink-muted);font-size:11px;margin:2px 0 5px}
.del-stats b{color:var(--ink);font-weight:600}
.meter{height:6px;border-radius:3px;background:var(--surface-sunken);position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;display:block}
.meter .sch{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.meter .cmp{background:var(--success)}
.caret{border:0;background:none;width:20px;height:20px;border-radius:4px;color:var(--ink-muted);display:grid;place-items:center;padding:0;flex:none}
.caret:hover{background:var(--surface-sunken)}
.caret svg{width:14px;height:14px;transition:transform .12s}.caret[aria-expanded=false] svg{transform:rotate(-90deg)}
.g-del .weeks{min-height:72px}
.g-del .bar{position:absolute;top:6px;height:18px;border-radius:5px;background:var(--accent-soft);color:var(--accent-strong);font-size:11px;font-weight:600;padding:0 8px;line-height:18px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border:1px solid var(--accent);z-index:1;pointer-events:none}
.g-del .bar.approx{background:var(--warning-soft);color:var(--warning);border:1px dashed var(--warning)}
.cell{position:relative;border:0;border-right:1px solid var(--line);background:transparent;padding:30px 3px 4px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0;min-height:72px}
.cell:hover,.cell:focus-visible{background:var(--accent-soft)}
.cell.now{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.cell.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.cell .plus{position:absolute;inset:auto;top:50%;left:50%;transform:translate(-50%,-30%);opacity:0;font-size:18px;color:var(--accent-strong)}
.cell:hover .plus{opacity:1}
.task{border-left:3px solid var(--c,var(--ink-muted));background:var(--surface-raised);border-radius:4px;padding:2px 5px;box-shadow:0 1px 2px rgba(0,0,0,.12);font-size:11px;line-height:14px;position:relative;overflow:hidden}
.task-top{display:flex;justify-content:space-between;gap:4px;color:var(--ink-muted)}.task-top b{color:var(--ink)}
.task-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task i{position:absolute;left:0;bottom:0;height:2px;background:var(--c)}
.event-row .g-label{color:var(--ink-muted)}
.marker{position:absolute;top:50%;transform:translate(-50%,-50%);color:var(--warning);font-size:14px}
.legend{display:flex;gap:var(--s4);padding:var(--s2) var(--s4);color:var(--ink-muted);font-size:11px;border-top:1px solid var(--line);background:var(--surface-raised);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:10px;border-radius:3px;display:inline-block}
.summary{background:var(--surface-raised);border-top:1px solid var(--line-strong)}
.summary-head{display:flex;align-items:center;justify-content:space-between;padding:var(--s2) var(--s4);cursor:pointer;border:0;background:none;width:100%;text-align:left}
.summary table{border-collapse:collapse;width:100%;font-size:12px}
.summary th,.summary td{padding:5px 12px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.summary th:first-child,.summary td:first-child{text-align:left}
.summary thead th{background:var(--surface-sunken);font-weight:700}
.summary .over{color:var(--danger);font-weight:700}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--c)}
.drawer{width:380px;max-width:92vw;flex:none;background:var(--surface-raised);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.drawer[hidden]{display:none}
.drawer-head{padding:var(--s4);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:var(--s3)}
.drawer-head h2{font-size:15px;line-height:22px;margin-top:2px}
.drawer-body{padding:var(--s3) var(--s4);overflow:auto;display:flex;flex-direction:column;gap:var(--s3)}
.record{border:1px solid var(--line);border-radius:var(--r-sm);padding:var(--s3);border-left:3px solid var(--c)}
.record-top{display:flex;justify-content:space-between;gap:var(--s2);font-weight:600}
.record-top b{color:var(--accent-strong);font-variant-numeric:tabular-nums}
.record .meter{margin-top:8px}
.record-actions{display:flex;gap:var(--s1);margin-top:var(--s2)}
.record-actions .btn{padding:2px 8px;font-size:12px}
.form-block{border-top:1px solid var(--line);padding-top:var(--s3);display:flex;flex-direction:column;gap:var(--s2)}

/* ===== Мои задачи ===== */
.tasks-page{overflow:auto;padding:var(--s6) clamp(16px,3vw,40px) 48px;flex:1}
.tasks-wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:var(--s4)}
.tasks-head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s4);flex-wrap:wrap}
.tasks-head p{color:var(--ink-muted);margin-top:2px}
.today-card{display:flex;gap:var(--s6);background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s3) var(--s4)}
.today-card div{display:flex;flex-direction:column}
.today-card strong{font-size:20px;line-height:26px;font-variant-numeric:tabular-nums}
.today-card .warn strong{color:var(--warning)}
.panel{background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.cal-bar{display:flex;align-items:center;justify-content:space-between;padding:var(--s3) var(--s4);border-bottom:1px solid var(--line)}
.cal-bar h2{font-size:15px;line-height:22px;text-transform:capitalize}
.cal-bar div{display:flex;gap:var(--s1)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal .wd{text-align:center;padding:6px;background:var(--surface-sunken);color:var(--ink-muted);font-size:11px;font-weight:700}
.day{min-height:72px;border:0;border-right:1px solid var(--line);border-top:1px solid var(--line);background:var(--surface-raised);padding:6px 8px;text-align:left;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.day:nth-child(7n){border-right:0}
.day:hover{background:var(--surface-sunken)}
.day.out{color:var(--ink-muted);background:var(--surface)}
.day.out .num{opacity:.6}
.day.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12px}
.day.today .num{background:var(--accent);color:var(--on-accent)}
.pills{display:flex;gap:4px;flex-wrap:wrap}
.pill{font-size:11px;line-height:16px;font-weight:600;border-radius:999px;padding:0 7px;white-space:nowrap}
.pill.p{background:var(--accent-soft);color:var(--accent-strong)}
.pill.d{background:var(--success-soft);color:var(--success)}
.board-panel{padding:var(--s4);display:flex;flex-direction:column;gap:var(--s4)}
.board-head{display:flex;justify-content:space-between;align-items:flex-start}
.board-head h2{font-size:15px;line-height:22px}
.editor{display:grid;grid-template-columns:2fr 150px 2fr auto;gap:var(--s3);align-items:end}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3)}
.col{background:var(--surface-sunken);border-radius:var(--r-md);padding:var(--s2);min-height:150px;display:flex;flex-direction:column;gap:var(--s2);border:2px solid transparent}
.col.over{border-color:var(--accent);background:var(--accent-soft)}
.col h3{display:flex;align-items:center;gap:var(--s2);padding:var(--s1) var(--s2);font-size:12px;line-height:18px}
.col h3 span{background:var(--surface-raised);border-radius:999px;font-size:11px;padding:0 7px;color:var(--ink-muted)}
.col h3::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink-muted)}
.col[data-s=doing] h3::before{background:var(--accent)}.col[data-s=done] h3::before{background:var(--success)}
.card{background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--r-sm);padding:var(--s2) var(--s3);cursor:grab;display:flex;flex-direction:column;gap:4px}
.card:hover{border-color:var(--line-strong)}
.card.dragging{opacity:.45}
.card-title{border:0;background:none;padding:0;text-align:left;font-weight:600}
.card[data-s=done] .card-title{text-decoration:line-through;color:var(--ink-muted)}
.card p{color:var(--ink-muted);font-size:12px}
.overdue{color:var(--warning);font-size:11px;font-weight:600}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:var(--s2);margin-top:2px}
.card-foot select{border:1px solid var(--line);background:var(--surface-sunken);border-radius:5px;font-size:11px;padding:2px 4px;color:var(--ink)}
.empty{color:var(--ink-muted);text-align:center;padding:var(--s4) 0;font-size:12px}
.collapsed{padding:var(--s6);text-align:center;color:var(--ink-muted);background:var(--surface-raised);border:1px dashed var(--line-strong);border-radius:var(--r-md)}
@media(max-width:900px){.editor{grid-template-columns:1fr}.board{grid-template-columns:1fr}.day{min-height:56px}.pill{font-size:10px;padding:0 5px}.drawer{position:fixed;right:0;top:0;bottom:0;z-index:30;box-shadow:var(--shadow-modal)}}
.proto-note{font-size:11px;color:var(--ink-muted);padding:2px 0}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand"><div class="brand-mark">К</div><div class="brand-text"><strong>Конструктор процессов</strong><small>Прототип редизайна</small></div></div>
    <nav class="nav" aria-label="Разделы">
      <button data-view="plan" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>План проектов</button>
      <button data-view="tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>Мои задачи</button>
    </nav>
    <div class="header-end">
      <div class="theme-switch" role="group" aria-label="Вариант дизайна">
        <button data-theme-btn="evolution" title="A · Спокойная эволюция">A</button>
        <button data-theme-btn="graphite" title="B · Графит">B</button>
        <button data-theme-btn="paper" title="C · Бумага">C</button>
      </div>
    </div>
  </header>

  <main class="main">
    <!-- ПЛАН ПРОЕКТОВ -->
    <section class="view on" id="view-plan">
      <div class="plan-toolbar">
        <div class="titles"><h1 class="page-title display">План проектов</h1><p>Недельный обзор поставок и работы</p></div>
        <input class="input search" type="search" placeholder="Поиск проекта или поставки" id="search" aria-label="Поиск">
        <button class="btn chip-filter" id="btn-filters">Фильтры <span class="count-badge" id="filter-count" hidden>1</span></button>
        <button class="btn">Ещё</button>
        <button class="btn primary">+ Добавить</button>
      </div>
      <div class="period">
        <button class="btn icon" id="prev" aria-label="Раньше">←</button>
        <button class="btn" id="to-today">Сегодня</button>
        <button class="btn icon" id="next" aria-label="Позже">→</button>
        <span class="caption" id="period-caption"></span>
      </div>
      <div class="plan-body">
        <div style="display:flex;flex-direction:column;flex:1;min-width:0">
          <div class="plan-scroll"><div class="grid" id="grid"></div></div>
          <div class="legend"><span><i style="background:var(--accent-soft);border:1px solid var(--accent)"></i>Поставка</span><span><i style="background:var(--warning-soft);border:1px dashed var(--warning)"></i>Приблизительный срок</span><span><i style="background:var(--surface-raised);border-left:3px solid var(--p1)"></i>Недельная задача</span><span><i style="background:var(--success)"></i>Выполнено</span><span style="color:var(--warning)">◆ Событие</span></div>
          <div class="summary" id="summary"></div>
        </div>
        <aside class="drawer" id="drawer" hidden aria-label="Недельные задачи"></aside>
      </div>
    </section>

    <!-- МОИ ЗАДАЧИ -->
    <section class="view" id="view-tasks">
      <div class="tasks-page"><div class="tasks-wrap" id="tasks-root"></div></div>
    </section>
  </main>
</div>

<script>
(function(){
'use strict';
var DAY=864e5;
function pad(n){return n<10?'0'+n:''+n}
function key(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(k){return new Date(k+'T12:00:00')}
function addDays(d,n){var x=new Date(d.getTime());x.setDate(x.getDate()+n);return x}
function monday(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate(),12);var w=(x.getDay()+6)%7;return addDays(x,-w)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var fmtShort=new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short'});
var fmtLong=new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long',year:'numeric'});
var fmtMonth=new Intl.DateTimeFormat('ru-RU',{month:'long',year:'numeric'});
var TODAY=new Date();TODAY=new Date(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate(),12);
var TODAY_KEY=key(TODAY);
function store(name,val){try{if(val===undefined){var v=localStorage.getItem(name);return v?JSON.parse(v):null}localStorage.setItem(name,JSON.stringify(val))}catch(e){return null}}

/* ---------- Тема и навигация ---------- */
var themes=['evolution','graphite','paper'];
function setTheme(t){if(themes.indexOf(t)<0)t='evolution';document.documentElement.dataset.theme=t;
  document.querySelectorAll('[data-theme-btn]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.themeBtn===t))});store('proto-theme',t)}
document.querySelectorAll('[data-theme-btn]').forEach(function(b){b.onclick=function(){setTheme(b.dataset.themeBtn)}});
function setView(v){document.querySelectorAll('.view').forEach(function(s){s.classList.toggle('on',s.id==='view-'+v)});
  document.querySelectorAll('[data-view]').forEach(function(b){if(b.dataset.view===v)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  try{history.replaceState(null,'','#'+v)}catch(e){}}
document.querySelectorAll('[data-view]').forEach(function(b){b.onclick=function(){setView(b.dataset.view)}});

/* ---------- ПЛАН ---------- */
var people={a:{name:'Анна',c:'var(--p1)'},b:{name:'Борис',c:'var(--p2)'},v:{name:'Вика',c:'var(--p3)'}};
var WEEKS=12,origin=addDays(monday(TODAY),-14);
var projects=[
 {id:'p1',name:'Платёжный шлюз',deliveries:[
   {id:'d1',name:'Интеграция с банком',start:0,end:5,test:40,dev:60,tasks:{0:[['a','Контракт API',6,6]],1:[['a','Подпись запросов',10,10],['b','Песочница',4,4]],2:[['a','Обработка ошибок',12,9]],3:[['b','Тесты сценариев',20,8],['v','Отчёт тестов',5,0]],4:[['b','Регресс',10,0]]}},
   {id:'d2',name:'Антифрод',start:3,end:9,test:30,dev:50,tasks:{3:[['v','Правила v1',8,8]],4:[['v','Правила v2',10,5]],6:[['a','Скоринг',14,0]]}}]},
 {id:'p2',name:'Мобильное приложение',deliveries:[
   {id:'d3',name:'Релиз 2.0',start:1,end:7,test:60,dev:90,tasks:{1:[['b','Онбординг',8,8]],2:[['b','Профиль',12,12],['v','Дизайн-ревью',3,3]],3:[['b','Лента',16,11]],5:[['v','Приёмка',20,0]]}},
   {id:'d4',name:'Push-уведомления',start:6,end:11,approx:true,test:0,dev:0,tasks:{}}]}
];
var events=[{label:'Заморозка кода',week:5},{label:'Релиз 2.0',week:8}];
var collapsed={},selCell=null,query='',weekShift=0;

function sums(d){var s=0,c=0;Object.keys(d.tasks).forEach(function(w){d.tasks[w].forEach(function(t){s+=t[2];c+=t[3]})});return {s:s,c:c,total:d.test+d.dev}}
function weekDate(i){return addDays(origin,(i+weekShift)*7)}
function curWeekIdx(){return Math.round((monday(TODAY)-origin)/(7*DAY))-weekShift}
function isoWeek(d){var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));var n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);var y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/DAY+1)/7)}
var chevron='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';

function renderGrid(){
  var now=curWeekIdx(),h='';
  h+='<div class="g-row g-head"><div class="g-label overline">Объекты плана</div><div class="weeks">';
  for(var i=0;i<WEEKS;i++){var d=weekDate(i);h+='<button class="wk-h '+(i===now?'now':'')+'" data-week="'+i+'" title="Нагрузка недели №'+isoWeek(d)+'"><strong>'+fmtShort.format(d).replace('.','')+'</strong><small>№'+isoWeek(d)+'</small></button>'}
  h+='</div></div>';
  var shown=0;
  projects.forEach(function(p){
    var dels=p.deliveries.filter(function(d){return !query||(p.name+' '+d.name).toLowerCase().indexOf(query)>=0});
    if(!dels.length)return;shown++;
    var open=!collapsed[p.id],s=Math.min.apply(null,dels.map(function(d){return d.start})),e=Math.max.apply(null,dels.map(function(d){return d.end}));
    h+='<div class="g-row g-project"><div class="g-label"><button class="caret" data-toggle="'+p.id+'" aria-expanded="'+open+'" aria-label="'+(open?'Свернуть':'Развернуть')+'">'+chevron+'</button><span>'+esc(p.name)+'</span><span class="caption" style="margin-left:auto;font-weight:400">'+dels.length+' пост.</span></div><div class="weeks"><div class="proj-bar" style="left:calc('+s+'/'+WEEKS+'*100% + 4px);width:calc('+(e-s+1)+'/'+WEEKS+'*100% - 8px)"></div></div></div>';
    if(!open)return;
    dels.forEach(function(d){
      var m=sums(d),pct=function(n){return m.total?Math.min(100,n/m.total*100):0};
      h+='<div class="g-row g-del"><div class="g-label"><div class="del-info"><button class="del-name" title="'+esc(d.name)+'">'+esc(d.name)+'</button>'
        +'<div class="del-stats">'+(m.total?'<span>Объём <b>'+m.total+'</b></span><span>План <b>'+m.s+'</b></span><span>Готово <b>'+m.c+'</b></span>':'<span>Объём не задан</span>')+'</div>'
        +'<div class="meter" role="img" aria-label="Распределено '+m.s+' из '+(m.total||'—')+', выполнено '+m.c+'"><i class="sch" style="width:'+pct(m.s)+'%"></i><i class="cmp" style="width:'+pct(m.c)+'%"></i></div></div></div><div class="weeks">'
        +'<div class="bar '+(d.approx?'approx':'')+'" style="left:calc('+d.start+'/'+WEEKS+'*100% + 3px);width:calc('+(d.end-d.start+1)+'/'+WEEKS+'*100% - 6px)">'+(d.approx?'≈ ':'')+esc(fmtShort.format(weekDate(d.start)))+' – '+esc(fmtShort.format(addDays(weekDate(d.end),4)))+'</div>';
      for(var i=0;i<WEEKS;i++){
        var list=(d.tasks[i]||[]).filter(function(){return true});
        var selected=selCell&&selCell.d===d.id&&selCell.w===i;
        h+='<button class="cell '+(i===now?'now':'')+(selected?' sel':'')+'" data-d="'+d.id+'" data-w="'+i+'" title="'+(list.length?list.map(function(t){return people[t[0]].name+': '+t[1]+' — '+t[3]+'/'+t[2]}).join('\n'):'Добавить задачу на неделю')+'">';
        list.forEach(function(t){h+='<span class="task" style="--c:'+people[t[0]].c+'"><span class="task-top"><span>'+people[t[0]].name+'</span><b>'+t[3]+'/'+t[2]+'</b></span><span class="task-title">'+esc(t[1])+'</span><i style="width:'+(t[2]?t[3]/t[2]*100:0)+'%"></i></span>'});
        if(!list.length)h+='<span class="plus">+</span>';
        h+='</button>';
      }
      h+='</div></div>';
    });
  });
  if(!shown)h+='<div style="padding:32px;text-align:center;color:var(--ink-muted)">Ничего не найдено. <button class="btn ghost" id="clear-q">Сбросить поиск</button></div>';
  else{
    h+='<div class="g-row event-row"><div class="g-label"><span class="overline">События</span></div><div class="weeks" style="min-height:36px">';
    events.forEach(function(ev){h+='<span class="marker" style="left:calc('+(ev.week+.5)+'/'+WEEKS+'*100%)" title="'+esc(ev.label)+'">◆</span>'});
    h+='</div></div>';
  }
  document.getElementById('grid').innerHTML=h;
  document.getElementById('period-caption').textContent=fmtShort.format(weekDate(0))+' – '+fmtShort.format(addDays(weekDate(WEEKS-1),4))+' · '+weekDate(0).getFullYear();
  var cq=document.getElementById('clear-q');if(cq)cq.onclick=function(){query='';document.getElementById('search').value='';renderGrid()};
}
function renderSummary(){
  var w=curWeekIdx(),h='<button class="summary-head" id="sum-toggle"><span><strong>Нагрузка недели</strong> <span class="caption">№'+isoWeek(weekDate(w))+' · '+fmtShort.format(weekDate(w))+' – '+fmtShort.format(addDays(weekDate(w),4))+'</span></span><span class="caption">Лимит: 40 задач на человека</span></button>';
  var rows={};projects.forEach(function(p){p.deliveries.forEach(function(d){(d.tasks[w]||[]).forEach(function(t){var r=rows[t[0]]=rows[t[0]]||{n:0,c:0};r.n+=t[2];r.c+=t[3]})})});
  h+='<table><thead><tr><th>Сотрудник</th><th>Назначено</th><th>Выполнено</th><th>Загрузка</th></tr></thead><tbody>';
  var ks=Object.keys(rows);
  if(!ks.length)h+='<tr><td colspan="4" style="text-align:center;color:var(--ink-muted)">На этой неделе задач нет</td></tr>';
  ks.forEach(function(k){var r=rows[k],load=Math.round(r.n/40*100);h+='<tr><td><span class="dot" style="--c:'+people[k].c+'"></span>'+people[k].name+'</td><td>'+r.n+'</td><td>'+r.c+'</td><td class="'+(load>100?'over':'')+'">'+load+'%</td></tr>'});
  h+='</tbody></table>';
  document.getElementById('summary').innerHTML=h;
}
function findDel(id){var r;projects.forEach(function(p){p.deliveries.forEach(function(d){if(d.id===id)r={p:p,d:d}})});return r}
function renderDrawer(){
  var dr=document.getElementById('drawer');
  if(!selCell){dr.hidden=true;return}
  var f=findDel(selCell.d),list=f.d.tasks[selCell.w]||[],wd=weekDate(selCell.w);
  var h='<div class="drawer-head"><div><div class="overline">Недельные задачи</div><h2>'+esc(f.p.name)+' / '+esc(f.d.name)+'</h2><div class="caption">'+fmtShort.format(wd)+' – '+fmtShort.format(addDays(wd,4))+'</div></div><button class="btn ghost icon" id="drawer-close" aria-label="Закрыть">✕</button></div><div class="drawer-body">';
  if(!list.length)h+='<p class="caption">На эту неделю задач пока нет.</p>';
  list.forEach(function(t,i){h+='<div class="record" style="--c:'+people[t[0]].c+'"><div class="record-top"><span>'+esc(t[1])+'</span><b>'+t[3]+'/'+t[2]+'</b></div><div class="caption">'+people[t[0]].name+'</div><div class="meter"><i class="cmp" style="width:'+(t[2]?t[3]/t[2]*100:0)+'%"></i></div><div class="record-actions"><button class="btn" data-inc="'+i+'">+1 готово</button><button class="btn danger" data-del="'+i+'">Удалить</button></div></div>'});
  h+='<form class="form-block" id="task-form"><strong>Новая задача</strong><label class="field">Название<input class="input" name="title" required maxlength="80" placeholder="Что нужно сделать?"></label><div style="display:grid;grid-template-columns:1fr 90px;gap:8px"><label class="field">Человек<select class="input" name="who">'+Object.keys(people).map(function(k){return '<option value="'+k+'">'+people[k].name+'</option>'}).join('')+'</select></label><label class="field">Задач<input class="input" name="count" type="number" min="1" value="5"></label></div><button class="btn primary" style="align-self:flex-start">Добавить</button></form></div>';
  dr.innerHTML=h;dr.hidden=false;
  document.getElementById('drawer-close').onclick=function(){selCell=null;renderAll()};
  dr.querySelectorAll('[data-inc]').forEach(function(b){b.onclick=function(){var t=list[+b.dataset.inc];if(t[3]<t[2])t[3]++;renderAll()}});
  dr.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(){if(confirm('Удалить недельную задачу?')){list.splice(+b.dataset.del,1);renderAll()}}});
  document.getElementById('task-form').onsubmit=function(e){e.preventDefault();var f2=e.target;(f.d.tasks[selCell.w]=f.d.tasks[selCell.w]||[]).push([f2.who.value,f2.title.value.trim(),+f2.count.value||1,0]);renderAll()};
}
function renderAll(){renderGrid();renderSummary();renderDrawer()}
document.getElementById('grid').addEventListener('click',function(e){
  var t=e.target.closest('[data-toggle]');if(t){collapsed[t.dataset.toggle]=!collapsed[t.dataset.toggle];renderGrid();return}
  var c=e.target.closest('.cell');if(c){selCell={d:c.dataset.d,w:+c.dataset.w};renderAll();return}
  var n=e.target.closest('.del-name');if(n){alert('В приложении здесь откроется диалог редактирования поставки.')}
});
document.getElementById('search').oninput=function(e){query=e.target.value.trim().toLowerCase();renderGrid()};
document.getElementById('btn-filters').onclick=function(){var b=document.getElementById('filter-count');b.hidden=!b.hidden};
document.getElementById('prev').onclick=function(){weekShift-=4;renderAll()};
document.getElementById('next').onclick=function(){weekShift+=4;renderAll()};
document.getElementById('to-today').onclick=function(){weekShift=0;renderAll()};

/* ---------- МОИ ЗАДАЧИ ---------- */
var STATUSES=[['todo','К выполнению'],['doing','В работе'],['done','Сделано']];
var wdays=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
function rel(n){return key(addDays(TODAY,n))}
var tasks=store('proto-tasks')||[
 {id:1,title:'Согласовать сроки интеграции',note:'Позвонить в банк',planned:rel(-2),status:'todo'},
 {id:2,title:'Подготовить отчёт по тестам',note:'',planned:rel(0),status:'doing'},
 {id:3,title:'Ревью макетов онбординга',note:'Фигма, 12 экранов',planned:rel(0),status:'todo'},
 {id:4,title:'Обновить план на декабрь',note:'',planned:rel(0),status:'done',completed:rel(0)},
 {id:5,title:'Встреча с командой антифрода',note:'',planned:rel(1),status:'todo'},
 {id:6,title:'Отправить копию данных',note:'',planned:rel(3),status:'todo'},
 {id:7,title:'Собрать вопросы к релизу',note:'',planned:rel(-4),status:'done',completed:rel(-4)},
 {id:8,title:'Проверить загрузку недели',note:'',planned:rel(-1),status:'done',completed:rel(-1)},
 {id:9,title:'Разобрать входящие',note:'',planned:rel(6),status:'todo'}
];
var nextId=100,tview=new Date(TODAY.getFullYear(),TODAY.getMonth(),1,12),tsel=TODAY_KEY,editing=null,dragId=null;
function saveTasks(){store('proto-tasks',tasks)}
function forDay(date){return tasks.filter(function(t){
  if(t.status==='done')return t.completed===date;
  return t.planned===date||(date===TODAY_KEY&&t.planned<TODAY_KEY)})}
function monthDays(){var first=new Date(tview.getFullYear(),tview.getMonth(),1,12),start=monday(first),out=[];
  var last=new Date(tview.getFullYear(),tview.getMonth()+1,0,12),n=Math.ceil(((monday(last)-start)/DAY+7)/7)*7;
  for(var i=0;i<n;i++){var d=addDays(start,i);out.push({k:key(d),n:d.getDate(),in:d.getMonth()===tview.getMonth()})}return out}
function renderTasks(){
  var cur=forDay(TODAY_KEY),active=cur.filter(function(t){return t.status!=='done'}).length,done=cur.length-active;
  var carried=tasks.filter(function(t){return t.status!=='done'&&t.planned<TODAY_KEY}).length;
  var h='<div class="tasks-head"><div><div class="overline">Личное пространство</div><h1 class="page-title display" style="margin-top:4px">Мои задачи</h1><p>План на каждый день. Незавершённые дела автоматически видны сегодня.</p></div>'
   +'<div class="today-card"><div><span class="caption">В планах сегодня</span><strong>'+active+'</strong></div><div><span class="caption">Сделано</span><strong style="color:var(--success)">'+done+'</strong></div>'+(carried?'<div class="warn"><span class="caption">Перенесено</span><strong>'+carried+'</strong></div>':'')+'</div></div>';
  h+='<div class="panel"><div class="cal-bar"><h2 class="display">'+fmtMonth.format(tview).replace(' г.','')+'</h2><div><button class="btn icon" data-m="-1" aria-label="Предыдущий месяц">←</button><button class="btn" data-m="0">Сегодня</button><button class="btn icon" data-m="1" aria-label="Следующий месяц">→</button></div></div><div class="cal">';
  wdays.forEach(function(w){h+='<div class="wd">'+w+'</div>'});
  monthDays().forEach(function(d){var e=forDay(d.k),p=e.filter(function(t){return t.status!=='done'}).length,c=e.length-p;
    h+='<button class="day '+(d.in?'':'out')+(d.k===TODAY_KEY?' today':'')+(d.k===tsel?' sel':'')+'" data-day="'+d.k+'" aria-pressed="'+(d.k===tsel)+'"><span class="num">'+d.n+'</span><span class="pills">'+(p?'<span class="pill p">'+p+' дел</span>':'')+(c?'<span class="pill d">'+c+' готово</span>':'')+'</span></button>'});
  h+='</div></div>';
  if(tsel){
    var list=forDay(tsel),ed=editing&&tasks.filter(function(t){return t.id===editing})[0];
    h+='<div class="panel board-panel"><div class="board-head"><div><div class="overline">Доска дня</div><h2 class="display">'+fmtLong.format(parse(tsel))+'</h2><span class="caption">'+list.length+' задач</span></div><button class="btn ghost icon" data-close aria-label="Свернуть доску">✕</button></div>'
     +'<form class="editor" id="t-form"><label class="field">Задача<input class="input" name="title" required maxlength="200" placeholder="Что нужно сделать?" value="'+(ed?esc(ed.title):'')+'"></label><label class="field">Дата<input class="input" type="date" name="date" required value="'+(ed?ed.planned:(tsel<TODAY_KEY?TODAY_KEY:tsel))+'"></label><label class="field">Заметка<input class="input" name="note" placeholder="Необязательно" value="'+(ed?esc(ed.note):'')+'"></label><div style="display:flex;gap:6px"><button class="btn primary">'+(ed?'Сохранить':'+ Добавить')+'</button>'+(ed?'<button type="button" class="btn" data-cancel>Отмена</button>':'')+'</div></form>'
     +'<div class="board">';
    STATUSES.forEach(function(s){
      var items=list.filter(function(t){return t.status===s[0]});
      h+='<section class="col" data-s="'+s[0]+'" aria-label="'+s[1]+'"><h3>'+s[1]+'<span>'+items.length+'</span></h3>'+(items.length?'':'<p class="empty">Пока пусто</p>');
      items.forEach(function(t){h+='<article class="card" draggable="true" data-id="'+t.id+'" data-s="'+t.status+'"><button class="card-title" data-edit="'+t.id+'" title="Редактировать">'+esc(t.title)+'</button>'+(t.note?'<p>'+esc(t.note)+'</p>':'')+(t.status!=='done'&&t.planned<TODAY_KEY?'<span class="overdue">С '+fmtLong.format(parse(t.planned))+'</span>':'')
        +'<div class="card-foot"><select data-status="'+t.id+'" aria-label="Статус: '+esc(t.title)+'">'+STATUSES.map(function(o){return '<option value="'+o[0]+'"'+(o[0]===t.status?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select><button class="btn ghost icon" data-remove="'+t.id+'" aria-label="Удалить: '+esc(t.title)+'" style="color:var(--danger)">🗑</button></div></article>'});
      h+='</section>'});
    h+='</div></div>';
  }else h+='<div class="collapsed">Выберите день в календаре, чтобы открыть доску задач.</div>';
  document.getElementById('tasks-root').innerHTML=h;
}
function moveTask(id,s){tasks.forEach(function(t){if(t.id===id){t.status=s;if(s==='done')t.completed=TODAY_KEY;else delete t.completed}});saveTasks();renderTasks()}
var root=document.getElementById('tasks-root');
root.addEventListener('click',function(e){
  var el;
  if((el=e.target.closest('[data-m]'))){var m=+el.dataset.m;tview=m===0?new Date(TODAY.getFullYear(),TODAY.getMonth(),1,12):new Date(tview.getFullYear(),tview.getMonth()+m,1,12);if(m===0)tsel=TODAY_KEY;else tsel=null;editing=null;renderTasks();return}
  if((el=e.target.closest('[data-day]'))){tsel=tsel===el.dataset.day?null:el.dataset.day;editing=null;renderTasks();return}
  if(e.target.closest('[data-close]')){tsel=null;renderTasks();return}
  if((el=e.target.closest('[data-edit]'))){editing=+el.dataset.edit;renderTasks();return}
  if(e.target.closest('[data-cancel]')){editing=null;renderTasks();return}
  if((el=e.target.closest('[data-remove]'))){var id=+el.dataset.remove,t=tasks.filter(function(x){return x.id===id})[0];if(confirm('Удалить задачу «'+t.title+'»?')){tasks=tasks.filter(function(x){return x.id!==id});saveTasks();renderTasks()}}
});
root.addEventListener('change',function(e){var el=e.target.closest('[data-status]');if(el)moveTask(+el.dataset.status,el.value)});
root.addEventListener('submit',function(e){e.preventDefault();var f=e.target,title=f.title.value.trim();if(!title)return;
  if(editing){tasks.forEach(function(t){if(t.id===editing){t.title=title;t.note=f.note.value.trim();t.planned=f.date.value}});editing=null}
  else tasks.push({id:nextId++,title:title,note:f.note.value.trim(),planned:f.date.value,status:'todo'});
  saveTasks();renderTasks()});
root.addEventListener('dragstart',function(e){var c=e.target.closest('.card');if(!c)return;dragId=+c.dataset.id;c.classList.add('dragging');e.dataTransfer.setData('text/plain',String(dragId));e.dataTransfer.effectAllowed='move'});
root.addEventListener('dragend',function(){dragId=null;root.querySelectorAll('.dragging,.over').forEach(function(x){x.classList.remove('dragging','over')})});
root.addEventListener('dragover',function(e){var c=e.target.closest('.col');if(c){e.preventDefault();c.classList.add('over')}});
root.addEventListener('dragleave',function(e){var c=e.target.closest('.col');if(c&&!c.contains(e.relatedTarget))c.classList.remove('over')});
root.addEventListener('drop',function(e){var c=e.target.closest('.col');if(!c)return;e.preventDefault();var id=+e.dataTransfer.getData('text/plain')||dragId;if(id)moveTask(id,c.dataset.s)});

/* ---------- Старт ---------- */
var q=new URLSearchParams(location.search);
setTheme(q.get('theme')||store('proto-theme')||'evolution');
renderAll();renderTasks();
setView((location.hash||'#plan').slice(1)==='tasks'?'tasks':'plan');
if(q.get('cell')){selCell={d:'d1',w:2};renderAll()}
})();
</script>
</body>
</html>
